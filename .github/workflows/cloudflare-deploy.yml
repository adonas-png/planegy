name: Deploy to Cloudflare
on:
  schedule:
    # 08:00 und 18:00 MESZ (06:00 und 16:00 UTC) - wie bisher bei Netlify
    - cron: '0 6 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}
  # Nur fuer den Testbetrieb auf workers.dev - vor dem Merge nach main entfernen
  push:
    branches: [cloudflare-migration]
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
