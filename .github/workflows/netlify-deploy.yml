name: Deploy to Netlify
# Stillgelegt seit dem Umzug zu Cloudflare (September 2026): planegy.de wird von Cloudflare Workers Builds
# bei jedem Push auf main deployt, IndexNow meldet .github/workflows/indexnow.yml.
# Nur noch manuell startbar, falls Netlify als Rückfall gebraucht wird.
on:
  workflow_dispatch: {}
concurrency:
  group: netlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --prod --dir=.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
