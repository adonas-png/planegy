name: Deploy to Netlify
on:
  schedule:
    # 08:00 und 18:00 MESZ (06:00 und 16:00 UTC) - buendelt alle Commits des Tages in 2 Deploys statt einem pro Push
    - cron: '0 6 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}
concurrency:
  group: netlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --prod --dir=.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
