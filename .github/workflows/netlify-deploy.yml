name: Deploy to Netlify
on:
  schedule:
    # 08:00 und 18:00 MESZ (06:00 und 16:00 UTC) - buendelt alle Commits des Tages in 2 Deploys statt einem pro Push
    - cron: '0 6 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}
concurrency:
  group: netlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --prod --dir=.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Meldet Seiten, die seit dem letzten Deploy geaendert wurden (auch neue Blogartikel), per IndexNow
      # an Bing, Yandex, Seznam und Naver. Der Schluessel ist oeffentlich und liegt als <key>.txt im Root.
      # Fehler hier brechen den Deploy nicht ab.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 15e153760e91d65de2a24fc12c30dbba
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          files = subprocess.run(
              ['git', 'log', '--since=15 hours ago', '--name-only', '--pretty=format:', '--', '*.html'],
              capture_output=True, text=True, check=True).stdout.split()
          skip = {'danke.html'}
          urls = sorted({
              'https://planegy.de/' if f == 'index.html' else 'https://planegy.de/' + f[:-5]
              for f in files if '/' not in f and f not in skip and os.path.exists(f)
          })
          if not urls:
              print('No changed pages')
              raise SystemExit(0)
          key = os.environ['INDEXNOW_KEY']
          body = json.dumps({'host': 'planegy.de', 'key': key,
                             'keyLocation': f'https://planegy.de/{key}.txt', 'urlList': urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body,
                                       headers={'Content-Type': 'application/json; charset=utf-8'})
          with urllib.request.urlopen(req, timeout=20) as res:
              print('IndexNow', res.status, len(urls), 'URLs')
          for u in urls:
              print(' ', u)
          PY
